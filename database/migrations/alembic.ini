# ═══════════════════════════════════════════════
# NOVA — Alembic Configuration
# ═══════════════════════════════════════════════

[alembic]
# Directorio de migraciones
script_location = .

# Template de nueva migración
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Separador de versiones
version_path_separator = os

# URL de la base de datos (se sobreescribe en env.py)
sqlalchemy.url = postgresql://nova_user:nova_secret_password@db:5432/nova_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
